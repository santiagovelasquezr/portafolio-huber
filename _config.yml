title: Proyecto Wearable
description: Wearable que detecta contaminantes en el aire y avisa al usuario cuándo protegerse. Colaboración entre Moda y Mecatrónica, Universidad Iberoamericana CDMX.

# GitHub Pages: modo recomendado
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

url: "https://santiagovelasquezr.github.io/"
baseurl: "/portafolio-huber"

#Configuracion Formato, Header y Footer
just_the_docs:
  # incluir CSS adicional
  custom_css:
    - "assets/css/custom.css"
  footer_content: ""

search_enabled: true
search:
  heading_level: 2

# Enlace auxiliar (aparece arriba a la derecha)
aux_links:
  "Repositorio en GitHub":
    - "https://github.com/santiagovelasquezr/portafolio-huber"

# Enlaces
permalink: pretty

exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules"
  - "vendor"
